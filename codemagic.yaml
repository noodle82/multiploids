workflows:
  ios-testflight:
    name: Multiploids iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.multiploids.tables
    scripts:
      - name: Install pinned dependencies
        script: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify learning rules and native configuration
        script: |
          npm test
          npm run ios:check
      - name: Bundle app and create iPhone and iPad project
        script: npm run ios:prepare
      - name: Apply distribution signing
        script: xcode-project use-profiles
      - name: Build signed IPA for Apple
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # The IPA is uploaded to App Store Connect. Select external beta review
        # there after entering the first build's test/contact information.
        submit_to_testflight: false
        submit_to_app_store: false
